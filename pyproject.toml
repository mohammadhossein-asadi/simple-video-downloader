[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-video-downloader"
dynamic = ["version"]
description = "A simple CLI to download videos, playlists, and channels - powered by yt-dlp"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mohammadhossein-asadi" }]
keywords = ["video", "downloader", "yt-dlp", "cli", "playlist", "channel"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "yt-dlp>=2024.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
video-downloader = "video_downloader.cli:main"

[project.urls]
Homepage = "https://github.com/mohammadhossein-asadi/simple-video-downloader"
Issues = "https://github.com/mohammadhossein-asadi/simple-video-downloader/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "video_downloader.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
